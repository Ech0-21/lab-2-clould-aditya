<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<meta name="color-scheme" content="dark">
<title>Today – Glass Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6f7ff; --ink-2:rgba(246,247,255,.68); --ink-3:rgba(246,247,255,.42);
  --glass-a:rgba(255,255,255,.17); --glass-b:rgba(255,255,255,.05);
  --edge:rgba(255,255,255,.26); --hi:rgba(255,255,255,.55);
  --accent:#7aa2ff; --accent-2:#c58bff; --ok:#6ff2c0;
  --p-high:#ff7a9c; --p-med:#ffc46b; --p-low:#7ad6ff;
  --r-xl:34px; --r-lg:24px; --r-md:18px; --r-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);background:#0b0d1a;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.005em;
  padding:clamp(20px,5vw,56px) 16px 72px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- backdrop: the colour the glass refracts ---------- */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 120%,#1a1140 0%,transparent 60%),#0b0d1a}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
.orb.o1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle at 35% 35%,#5b7cff,#3a2bd6 60%,transparent 72%)}
.orb.o2{width:40vmax;height:40vmax;right:-14vmax;top:12vmax;background:radial-gradient(circle at 60% 40%,#d46bff,#8a2be2 55%,transparent 72%)}
.orb.o3{width:34vmax;height:34vmax;left:18vmax;bottom:-16vmax;background:radial-gradient(circle at 50% 50%,#2fe0c0,#0a8fb3 55%,transparent 72%);opacity:.75}
.backdrop::after{content:"";position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (prefers-reduced-motion:no-preference){
  .orb.o1{animation:drift 26s ease-in-out infinite alternate}
  .orb.o2{animation:drift 32s ease-in-out infinite alternate-reverse}
}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}

/* ---------- the glass material ---------- */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(145deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.06);
  backdrop-filter:blur(30px) saturate(190%) brightness(1.06);
  border:1px solid var(--edge);
  box-shadow:
    inset 0 1.5px 0 var(--hi),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 22px rgba(255,255,255,.05),
    0 1px 2px rgba(0,0,0,.25),
    0 24px 60px -12px rgba(5,6,25,.6);
}
.glass::before{ /* specular sheen */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:
    radial-gradient(120% 70% at 12% -10%,rgba(255,255,255,.28),transparent 55%),
    linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%);
}

/* ---------- layout ---------- */
.app{max-width:680px;margin:0 auto;display:grid;gap:20px}
.panel{border-radius:var(--r-xl);padding:clamp(20px,4vw,30px)}

/* ---------- header ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero h1{margin:0;font-size:clamp(38px,9vw,56px);font-weight:800;letter-spacing:-.045em;line-height:1}
.hero .date{margin:8px 0 0;color:var(--ink-2);font-weight:500}
.ring{
  --p:25;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(from -90deg,var(--accent) calc(var(--p)*1%),rgba(255,255,255,.12) 0);
  box-shadow:0 0 30px -4px rgba(122,162,255,.55);
}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;
  background:rgba(14,16,38,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ring output{position:relative;font-weight:800;font-size:22px;letter-spacing:-.03em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{border-radius:var(--r-md);padding:14px 16px;background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.07)}
.stat output{display:block;font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-2);font-weight:600}

/* ---------- composer ---------- */
.composer{display:grid;gap:12px}
.field{display:flex;align-items:center;gap:10px;border-radius:var(--r-pill);padding:6px 6px 6px 22px;
  background:rgba(8,10,30,.35);box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14);
  transition:box-shadow .3s var(--ease)}
.field:focus-within{box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1.5px var(--accent),0 0 0 5px rgba(122,162,255,.22)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;font-weight:500;padding:12px 0}
.field input::placeholder{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}

.btn{
  appearance:none;border:0;cursor:pointer;border-radius:var(--r-pill);padding:12px 22px;font-weight:700;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.2),0 8px 20px -6px rgba(0,0,0,.5);
  transition:transform .35s var(--ease),filter .25s;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#9bb8ff,#5b7cff 60%,#7a5bff);color:#fff;text-shadow:0 1px 2px rgba(0,0,40,.35);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(40,20,160,.4),0 10px 26px -6px rgba(91,124,255,.75)}
.btn.ghost{background:rgba(255,255,255,.07);font-weight:600;color:var(--ink-2)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;border-radius:var(--r-pill);
  padding:11px 38px 11px 18px;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.select select option{color:#111}
.select::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;margin-top:-6px;
  border:solid var(--ink-2);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.row .search{flex:1;min-width:150px;display:flex}
.row .search input{width:100%;border:0;outline:0;border-radius:var(--r-pill);padding:11px 18px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.1)}
.row .search input::placeholder{color:var(--ink-3)}

/* ---------- segmented filter (works without JS) ---------- */
.seg{display:inline-grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:var(--r-pill);
  background:rgba(8,10,30,.35);box-shadow:inset 0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.1);width:100%}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;cursor:pointer;padding:10px 12px;border-radius:var(--r-pill);font-weight:700;color:var(--ink-2);
  transition:background .35s var(--ease),color .25s,box-shadow .35s var(--ease)}
.seg input:checked+label{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),0 6px 16px -4px rgba(0,0,0,.45)}
.seg input:focus-visible+label{outline:2px solid #fff;outline-offset:2px}

/* ---------- tasks ---------- */
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 14px}
.list-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.025em}
.list-head span{color:var(--ink-2);font-size:14px;font-weight:600}
#task-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.task{
  display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:var(--r-lg);
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.08);
  transition:transform .4s var(--ease),background .3s,opacity .3s;
}
.task:hover{transform:translateY(-2px);background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.05))}
.task .check{position:absolute;opacity:0;pointer-events:none}
.task .box{flex:none;width:28px;height:28px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:rgba(8,10,30,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.35);
  transition:background .35s var(--ease),box-shadow .35s var(--ease),transform .35s var(--ease)}
.task .box::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid #07261c;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) scale(0);transition:transform .35s var(--ease)}
.task .check:checked+.box{background:linear-gradient(180deg,#b9ffe5,var(--ok));
  box-shadow:0 0 18px rgba(111,242,192,.55),inset 0 1px 0 #fff}
.task .check:checked+.box::after{transform:rotate(45deg) scale(1)}
.task .check:focus-visible+.box{outline:2px solid #fff;outline-offset:3px}
.task .label{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;transition:color .3s,opacity .3s}
.task .check:checked~.label{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.task .meta{display:block;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:2px}
.chip{flex:none;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.task[data-priority="high"]{--c:var(--p-high)}
.task[data-priority="medium"]{--c:var(--p-med)}
.task[data-priority="low"]{--c:var(--p-low)}
.task .remove{flex:none;width:34px;height:34px;padding:0;border-radius:50%;cursor:pointer;border:0;
  background:rgba(255,255,255,.07);color:var(--ink-2);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:background .25s,color .25s,transform .3s var(--ease)}
.task .remove:hover{background:rgba(255,110,140,.3);color:#fff}
.task .remove:active{transform:scale(.9)}

/* CSS-only filtering (JS can replace this with data-hidden) */
.app:has(#filter-active:checked) .task:has(.check:checked),
.app:has(#filter-done:checked) .task:not(:has(.check:checked)),
.task[data-hidden="true"]{display:none}

.empty{text-align:center;padding:34px 12px 18px;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:0 4px}
.foot small{color:var(--ink-3);font-weight:600}



/* ---------- credit badge ---------- */
.credit{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:5;
  padding:10px 16px;border-radius:var(--r-md);text-align:right;line-height:1.3;font-size:13px}
.credit b{display:block;font-weight:800;letter-spacing:-.01em;font-size:14px}
.credit span{display:block;color:var(--ink-2);font-weight:500;letter-spacing:.02em}
@media (max-width:820px){
  .credit{position:static;width:max-content;margin:0 0 14px auto}
}

/* ---------- loading, disabled, errors ---------- */
.btn:disabled,.task .remove:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.task[aria-busy="true"]{opacity:.6}
.task[aria-busy="true"]:hover{transform:none}
.task .check:disabled+.box{cursor:progress}
.spinner{flex:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
.loading{display:grid;gap:12px}
.loading .status{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 4px;color:var(--ink-2);font-weight:600}
.skel{height:64px;border-radius:var(--r-lg);background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.05) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-radius:var(--r-lg);
  background:linear-gradient(145deg,rgba(255,90,120,.38),rgba(255,90,120,.14));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,130,150,.45),0 16px 40px -14px rgba(255,60,100,.5)}
.banner p{margin:0;flex:1;font-weight:600}
.banner .btn{padding:8px 16px}
.banner .close{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}

@media (max-width:520px){
  .hero{grid-template-columns:1fr}.ring{display:none}
  .stat output{font-size:24px}.chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.spinner{animation:spin 1.6s linear infinite!important}}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<aside class="glass credit" aria-label="Author">
  <b>By - Aditya Singh</b>
  <span>PU02424EUG10003</span>
</aside>

<noscript><!-- Tasks are loaded from the server, so JavaScript is required. --></noscript>

<main class="app" id="app" data-app="todo" data-api="/api/tasks">

  <!-- OVERVIEW -->
  <header class="glass panel" id="overview">
    <div class="hero">
      <div>
        <h1>Today</h1>
        <p class="date" id="today-date"><time datetime="2026-10-27">Tuesday, October 27</time></p>
      </div>
      <div class="ring" id="progress-ring" style="--p:0" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <output id="progress-text">–</output>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><output id="stat-total">–</output><span>Tasks</span></div>
      <div class="stat"><output id="stat-done">–</output><span>Done</span></div>
      <div class="stat"><output id="stat-left">–</output><span>Left</span></div>
    </div>
  </header>

  <!-- ERRORS -->
  <div class="banner" id="error-banner" role="alert" hidden>
    <p id="error-text"></p>
    <button class="btn" type="button" id="error-retry" hidden>Retry</button>
    <button class="close" type="button" id="error-close" aria-label="Dismiss">✕</button>
  </div>

  <!-- COMPOSER -->
  <section class="glass panel" aria-label="Add a task">
    <form class="composer" id="task-form" autocomplete="off" novalidate>
      <div class="field">
        <input type="text" id="task-input" name="title" placeholder="What needs doing?" maxlength="120" required aria-label="Task title">
        <button class="btn primary" type="submit" id="add-btn" disabled>Add task</button>
      </div>
      <div class="row">
        <div class="select">
          <select id="task-priority" name="priority" aria-label="Priority">
            <option value="high">High priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="low">Low priority</option>
          </select>
        </div>
        <label class="search"><input type="search" id="search-input" placeholder="Search tasks" aria-label="Search tasks"></label>
      </div>
    </form>
  </section>

  <!-- LIST -->
  <section class="glass panel" aria-labelledby="list-title">
    <div class="seg" id="filters" role="radiogroup" aria-label="Filter tasks">
      <input type="radio" name="filter" id="filter-all" value="all" data-filter="all" checked><label for="filter-all">All</label>
      <input type="radio" name="filter" id="filter-active" value="active" data-filter="active"><label for="filter-active">Active</label>
      <input type="radio" name="filter" id="filter-done" value="done" data-filter="done"><label for="filter-done">Done</label>
    </div>

    <div class="list-head" style="margin-top:22px">
      <h2 id="list-title">Your list</h2>
      <span id="list-count" aria-live="polite">Loading…</span>
    </div>

    <ul id="task-list" aria-live="polite" aria-busy="true"></ul>

    <div class="loading" id="loading-state" role="status">
      <div class="status"><i class="spinner" aria-hidden="true"></i><span>Loading your tasks…</span></div>
      <div class="skel" aria-hidden="true"></div><div class="skel" aria-hidden="true"></div><div class="skel" aria-hidden="true"></div>
    </div>

    <div class="empty" id="empty-state" hidden>
      <strong>Nothing to show</strong>
      Add a task above or change the filter.
    </div>

    <div class="foot">
      <small id="sync-note" aria-live="polite">Connecting…</small>
      <button class="btn ghost" type="button" id="clear-done" data-action="clear-done" disabled>Clear completed</button>
    </div>
  </section>
</main>

<!-- Blueprint for a new task (JS clones this) -->
<template id="task-template">
  <li class="task" data-id="" data-priority="medium" data-done="false">
    <input class="check" type="checkbox" aria-label="Mark complete"><label class="box"></label>
    <div class="label"><span data-slot="title"></span><span class="meta" data-slot="meta"></span></div>
    <span class="chip" data-slot="priority"></span>
    <button class="remove" type="button" data-action="remove" aria-label="Delete task">✕</button>
  </li>
</template>

<!--
  Data flow: app.js -> Express (/api/tasks) -> Redis. Nothing is stored in the browser.
  GET /api/tasks | POST /api/tasks | PATCH /api/tasks/:id | DELETE /api/tasks/:id | DELETE /api/tasks?completed=true
-->
<script src="app.js" defer></script>
</body>
</html>
